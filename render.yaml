services:
  - type: web
    name: werkstuur-app
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_server.py
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_URL
        value: https://bhajnludwvuyewxyxqhb.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: preflight-attachments
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_HOURS
        value: "12"
      - key: MAIL_TRANSPORT
        value: https
      - key: WEBMAIL_RELAY_URL
        value: https://werkstuur.nl/app-mail.php
      - key: WEBMAIL_RELAY_SECRET
        sync: false
      - key: MAIL_NOTIFICATIONS_ENABLED
        value: "1"
      - key: SMTP_FROM_EMAIL
        value: info@werkstuur.nl
      - key: SMTP_REPLY_TO
        value: support@werkstuur.nl
      - key: WEBSITE_URL
        value: https://werkstuur.nl
      - key: APP_PUBLIC_URL
        value: https://portal.werkstuur.nl
      - key: OPERATIONS_TOKEN
        sync: false
      - key: BACKUP_AUTOMATION_ENABLED
        value: "1"
